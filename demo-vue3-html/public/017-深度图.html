<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesium 深度图生成器</title>
    <script src="./Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="./Cesium/Widgets/widgets.css" />
    <script src="./lib/larkexplorer.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #cesiumContainer {
        width: 100vw;
        height: 100vh;
      }
      .control-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        max-width: 320px;
        z-index: 1000;
      }
      h2 {
        margin: 0 0 15px 0;
        font-size: 18px;
        color: #1a1a1a;
        font-weight: 600;
      }
      .btn {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .btn-secondary {
        background: #f3f4f6;
        color: #374151;
      }
      .btn-secondary:hover:not(:disabled) {
        background: #e5e7eb;
      }
      .btn-danger {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
      }
      .btn-danger:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
      }
      .status-info {
        background: #e0f2fe;
        color: #075985;
        border-left: 3px solid #0284c7;
      }
      .status-success {
        background: #d1fae5;
        color: #065f46;
        border-left: 3px solid #10b981;
      }
      .status-error {
        background: #fee2e2;
        color: #991b1b;
        border-left: 3px solid #ef4444;
      }
      .input-group {
        margin: 12px 0;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
      }
      .input-group input {
        width: 100%;
        padding: 10px;
        border: 2px solid #e5e7eb;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      .input-group input:focus {
        outline: none;
        border-color: #667eea;
      }
      .result-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        max-width: 350px;
        z-index: 1000;
        display: none;
      }
      .result-panel.show {
        display: block;
      }
      #depthMapCanvas {
        width: 100%;
        border-radius: 8px;
        margin-top: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .stats {
        margin-top: 12px;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.8;
      }
      .stats strong {
        color: #1f2937;
      }
      .version-badge {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div class="control-panel">
      <h2>🗺️ 深度图生成器<span class="version-badge">v1.136</span></h2>

      <div class="input-group">
        <label>分辨率（像素）</label>
        <input
          type="number"
          id="resolution"
          value="512"
          min="128"
          max="2048"
          step="128"
        />
      </div>

      <button class="btn btn-primary" id="startDrawBtn">开始绘制多边形</button>
      <button class="btn btn-secondary" id="finishDrawBtn" disabled>
        完成绘制
      </button>
      <button class="btn btn-primary" id="generateBtn" disabled>
        生成深度图
      </button>
      <button class="btn btn-danger" id="clearBtn">清除所有</button>

      <div class="status status-info" id="status">
        点击"开始绘制多边形"开始绘制区域
      </div>
    </div>

    <div class="result-panel" id="resultPanel">
      <h2>📊 深度图结果</h2>
      <canvas id="depthMapCanvas"></canvas>
      <div class="stats" id="stats"></div>
      <button class="btn btn-secondary" id="downloadBtn">下载深度图</button>
    </div>

    <script>
      const { DefaultTdtImg, getTerrain } = LarkExplorer.BaseLayer
      const viewer = new LarkExplorer.Viewer("cesiumContainer", {
        baseLayer: DefaultTdtImg,
        fpsShow: true,
        mapboxController: true,
        terrain: getTerrain(
          "https://www.larkview.cn/tileserver/api/terrain/china_dem_30"
        ),
      })
      // 状态管理
      let isDrawing = false
      let drawingPoints = []
      let polygonEntity = null
      let pointEntities = []
      let handler = null

      // DOM 元素
      const startDrawBtn = document.getElementById("startDrawBtn")
      const finishDrawBtn = document.getElementById("finishDrawBtn")
      const generateBtn = document.getElementById("generateBtn")
      const clearBtn = document.getElementById("clearBtn")
      const status = document.getElementById("status")
      const resultPanel = document.getElementById("resultPanel")
      const depthMapCanvas = document.getElementById("depthMapCanvas")
      const stats = document.getElementById("stats")
      const downloadBtn = document.getElementById("downloadBtn")
      const resolution = document.getElementById("resolution")

      // 更新状态显示
      function updateStatus(message, type = "info") {
        status.className = `status status-${type}`
        status.textContent = message
      }

      // 开始绘制
      startDrawBtn.onclick = () => {
        isDrawing = true
        drawingPoints = []
        clearEntities()

        startDrawBtn.disabled = true
        finishDrawBtn.disabled = false
        generateBtn.disabled = true

        updateStatus("在地图上点击添加多边形顶点（至少3个点）", "info")

        handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas)
        handler.setInputAction((click) => {
          if (!isDrawing) return

          const cartesian = viewer.camera.pickEllipsoid(
            click.position,
            viewer.scene.globe.ellipsoid
          )
          if (cartesian) {
            drawingPoints.push(cartesian)

            // 添加点标记
            const point = viewer.entities.add({
              position: cartesian,
              point: {
                pixelSize: 10,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
              },
            })
            pointEntities.push(point)

            updateDrawingPolygon()
            updateStatus(`已添加 ${drawingPoints.length} 个顶点`, "info")
          }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK)
      }

      // 更新绘制中的多边形
      function updateDrawingPolygon() {
        if (polygonEntity) {
          viewer.entities.remove(polygonEntity)
        }

        if (drawingPoints.length >= 3) {
          polygonEntity = viewer.entities.add({
            polygon: {
              hierarchy: new Cesium.PolygonHierarchy(drawingPoints),
              material: Cesium.Color.YELLOW.withAlpha(0.3),
              outline: true,
              outlineColor: Cesium.Color.YELLOW,
              outlineWidth: 2,
              heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            },
          })
          finishDrawBtn.disabled = false
        }
      }

      // 完成绘制
      finishDrawBtn.onclick = () => {
        if (drawingPoints.length < 3) {
          updateStatus("至少需要3个顶点才能形成多边形", "error")
          return
        }

        isDrawing = false
        if (handler) {
          handler.destroy()
          handler = null
        }

        startDrawBtn.disabled = false
        finishDrawBtn.disabled = true
        generateBtn.disabled = false

        updateStatus(
          `多边形绘制完成，共 ${drawingPoints.length} 个顶点。点击"生成深度图"开始处理`,
          "success"
        )
      }

      // 清除所有
      clearBtn.onclick = () => {
        clearEntities()
        drawingPoints = []
        isDrawing = false

        if (handler) {
          handler.destroy()
          handler = null
        }

        startDrawBtn.disabled = false
        finishDrawBtn.disabled = true
        generateBtn.disabled = true
        resultPanel.classList.remove("show")

        updateStatus("已清除所有内容", "info")
      }

      // 清除实体
      function clearEntities() {
        pointEntities.forEach((e) => viewer.entities.remove(e))
        pointEntities = []
        if (polygonEntity) {
          viewer.entities.remove(polygonEntity)
          polygonEntity = null
        }
      }

      // 生成深度图
      generateBtn.onclick = async () => {
        try {
          generateBtn.disabled = true
          updateStatus("正在生成深度图...", "info")

          // 计算多边形的外接矩形
          const rectangle = calculateBoundingRectangle(drawingPoints)

          updateStatus("正在采样地形高度数据（使用最高精度）...", "info")

          // 采样地形高度
          const res = parseInt(resolution.value)
          const depthData = await sampleTerrainHeights(rectangle, res)

          updateStatus("正在渲染深度图...", "info")

          // 渲染深度图
          renderDepthMap(depthData, res)

          // 显示结果
          resultPanel.classList.add("show")
          updateStatus("深度图生成成功！", "success")
        } catch (error) {
          console.error("生成深度图失败:", error)
          updateStatus("生成失败: " + error.message, "error")
        } finally {
          generateBtn.disabled = false
        }
      }

      // 计算外接矩形
      function calculateBoundingRectangle(points) {
        const cartographics = points.map((p) =>
          Cesium.Cartographic.fromCartesian(p)
        )

        let west = cartographics[0].longitude
        let south = cartographics[0].latitude
        let east = cartographics[0].longitude
        let north = cartographics[0].latitude

        cartographics.forEach((c) => {
          west = Math.min(west, c.longitude)
          east = Math.max(east, c.longitude)
          south = Math.min(south, c.latitude)
          north = Math.max(north, c.latitude)
        })

        return new Cesium.Rectangle(west, south, east, north)
      }

      // 采样地形高度 - 使用最新 API
      async function sampleTerrainHeights(rectangle, resolution) {
        const positions = []
        const width = resolution
        const height = resolution

        // 生成采样点
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const lon = Cesium.Math.lerp(
              rectangle.west,
              rectangle.east,
              x / (width - 1)
            )
            const lat = Cesium.Math.lerp(
              rectangle.south,
              rectangle.north,
              y / (height - 1)
            )
            positions.push(new Cesium.Cartographic(lon, lat))
          }
        }

        // 使用 sampleTerrainMostDetailed 获取最高精度地形数据
        const terrainProvider = viewer.terrainProvider
        const sampledPositions = await Cesium.sampleTerrainMostDetailed(
          terrainProvider,
          positions
        )

        // 提取高度数据
        const heights = sampledPositions.map((p) => p.height || 0)
        console.log(heights)
        return {
          heights: heights,
          width: width,
          height: height,
          min: Math.min(...heights),
          max: Math.max(...heights),
        }
      }

      // 渲染深度图
      function renderDepthMap(depthData, resolution) {
        const canvas = depthMapCanvas
        canvas.width = resolution
        canvas.height = resolution
        const ctx = canvas.getContext("2d")

        const imageData = ctx.createImageData(resolution, resolution)
        const data = imageData.data

        const { heights, min, max } = depthData
        const range = max - min

        // 转换为灰度图（高度归一化到 0-255）
        for (let i = 0; i < heights.length; i++) {
          const normalized = range > 0 ? (heights[i] - min) / range : 0
          const value = Math.floor(normalized * 255)

          const idx = i * 4
          data[idx] = value // R
          data[idx + 1] = value // G
          data[idx + 2] = value // B
          data[idx + 3] = 255 // A
        }

        ctx.putImageData(imageData, 0, 0)

        // 更新统计信息
        stats.innerHTML = `
                <strong>分辨率:</strong> ${resolution} × ${resolution}<br>
                <strong>采样点数:</strong> ${heights.length.toLocaleString()}<br>
                <strong>最低高度:</strong> ${min.toFixed(2)} 米<br>
                <strong>最高高度:</strong> ${max.toFixed(2)} 米<br>
                <strong>高度差:</strong> ${range.toFixed(2)} 米
            `
      }

      // 下载深度图
      downloadBtn.onclick = () => {
        const link = document.createElement("a")
        link.download = `depth_map_${Date.now()}.png`
        link.href = depthMapCanvas.toDataURL()
        link.click()
      }

      // 初始化相机位置
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(120.0, 30.0, 1000000),
        duration: 2,
      })

      console.log("🚀 Cesium v1.136 深度图生成器已启动")
      console.log("📦 使用 Terrain.fromWorldTerrain() API")
      console.log("🎯 支持异步场景拾取和增强的地形拾取性能")
    </script>
  </body>
</html>
